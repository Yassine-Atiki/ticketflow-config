server:
  port: 8081

spring:
  application:
    name: customer-service

  datasource:
    url: jdbc:postgresql://localhost:5433/customer_db
    username: customer_user
    password: customer_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

eureka:
  client:
    refresh:
      enable: false

springdoc:
  swagger-ui:
    url: /openapi.yaml
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

ticketflow:
  message: "Tester le rafraichissement de configuration V2"