
server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/event_db
    username: event_user
    password: event_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # Temporaire : Kafka non encore intégré au code métier
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yml
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info